[project]
name = "kriterion"
version = "0.1.0"
description = "Workload-aware AI model qualification and admission system"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
kriterion = "kriterion.cli:main"
kriterion-firecracker-runner = "kriterion.firecracker_runner:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kriterion*"]
